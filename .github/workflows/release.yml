name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Music Player
        uses: actions/checkout@v4

      - name: Validate application
        run: |
          python3 -m compileall -q files tools tests
          python3 -m unittest discover -s tests -v
          sh -n files/launch.sh
          sh -n entry/launch.sh

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(python3 -c 'from pathlib import Path; scope={}; exec(Path("files/musicplayer/__init__.py").read_text(), scope); print(scope["APP_VERSION"])')"
          test "$TAG_VERSION" = "$APP_VERSION"

      - name: Build and verify release
        env:
          MUSIC_PLAYER_GITHUB_REPO: ${{ github.repository }}
        run: |
          python3 tools/make_release.py
          python3 tools/verify_release.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: trimui-music-player
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --title "Music Player $GITHUB_REF_NAME" \
            --generate-notes \
            dist/trimui-music-player-v*.zip \
            dist/trimui-music-player-v*.zip.sha256 \
            dist/portable-manifest.json
